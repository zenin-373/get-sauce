
version: 2

project_name: get-sauce

before:
  hooks:
    - go mod download

builds:
  - id: get-sauce
    main: .
    binary: get-sauce

    env:
      - CGO_ENABLED=0

    goos:
      - windows
      - linux
      - darwin

    goarch:
      - amd64
      - arm64

    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: binaries
    formats:
      - tar.gz
      - zip

    name_template: "get-sauce_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

    files:
      - README*
      - LICENSE*

checksum:
  name_template: checksums.txt

changelog:
  disable: true
