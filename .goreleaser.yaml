version: 2

project_name: get-sauce

before:
  hooks:
    - go mod download

builds:
  - id: get-sauce
    main: .
    binary: get-sauce
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: binaries
    formats:
      - zip
      - tar.gz
    name_template: "get-sauce_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README*
      - LICENSE*
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true
